name: validate

on:
  push:
    branches: [main]
    paths:
      - "custom/**/*.txt"
      - "output/*.txt"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "custom/**/*.txt"
      - "output/*.txt"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild output/ and verify it matches committed files
        run: |
          set -euo pipefail
          python scripts/build.py
          git diff --exit-code output/ || {
            echo "::error::output/ is out of sync — run scripts/build.py and commit"
            exit 1
          }

      - name: Validate output formats
        run: |
          set -euo pipefail
          fail=0
          err(){ echo "::error::$1"; fail=1; }

          for f in output/adblock.txt output/domains.txt output/hosts.txt; do
            [ -s "$f" ] || err "$f missing or empty"
          done
          [ "$fail" -eq 0 ] || exit 1

          # adblock: ! comments, blank, or ||domain^
          grep -vE '^(!|$)' output/adblock.txt | grep -vE '^\|\|[a-z0-9._-]+\^$' \
            && err "adblock.txt has lines not matching '||domain^'" || true
          # domains: # comments, blank, or bare domain
          grep -vE '^(#|$)' output/domains.txt | grep -vE '^[a-z0-9._-]+$' \
            && err "domains.txt has lines not matching bare domain" || true
          # hosts: # comments, blank, or 0.0.0.0 domain
          grep -vE '^(#|$)' output/hosts.txt | grep -vE '^0\.0\.0\.0 [a-z0-9._-]+$' \
            && err "hosts.txt has lines not matching '0.0.0.0 domain'" || true

          # normalize to sorted domain sets
          grep -E '^\|\|' output/adblock.txt | sed 's/^||//; s/\^$//' | sort > /tmp/ab.set
          grep -vE '^(#|$)' output/domains.txt | sort > /tmp/dm.set
          grep -E '^0\.0\.0\.0 ' output/hosts.txt | sed 's/^0\.0\.0\.0 //' | sort > /tmp/hs.set

          # no duplicates within any file
          for s in ab dm hs; do
            dup=$(uniq -d "/tmp/$s.set" || true)
            [ -z "$dup" ] || err "duplicate domains in $s: $(echo "$dup" | tr '\n' ' ')"
          done

          # three files in sync
          diff /tmp/ab.set /tmp/dm.set > /tmp/d1 || { err "adblock vs domains differ"; cat /tmp/d1; }
          diff /tmp/ab.set /tmp/hs.set > /tmp/d2 || { err "adblock vs hosts differ"; cat /tmp/d2; }

          n=$(wc -l < /tmp/dm.set)
          echo "::notice::$n domains, all three formats in sync"
          [ "$fail" -eq 0 ] || exit 1
