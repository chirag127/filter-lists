name: prerelease

on:
  push:
    branches: [main]
    paths:
      - "custom/**/*.txt"
      - "output/*.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag + domain count
        id: meta
        run: |
          set -euo pipefail
          n=$(grep -cvE '^(#|$)' output/domains.txt)
          echo "tag=snapshot-$(date -u +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease with the three lists attached
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Blocklist snapshot ${{ steps.meta.outputs.tag }}"
          body: |
            Automated snapshot — ${{ steps.meta.outputs.count }} custom domains, three formats attached.

            Subscribe from the raw files on `main`, or pin this snapshot:
            - `adblock.txt` — AdGuard / uBlock Origin / Pi-hole v6
            - `domains.txt` — NextDNS / plain resolvers
            - `hosts.txt` — /etc/hosts / Pi-hole / AdGuard Home

            Note: Enable OISD Full + AdGuard DNS Filter first; this list only adds what they miss.
          prerelease: true
          files: |
            output/adblock.txt
            output/domains.txt
            output/hosts.txt
